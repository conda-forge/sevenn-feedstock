schema_version: 1

context:
  name: sevenn
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sevenn-${{ version }}.tar.gz
  sha256: 3f8c217182dc3d1bc3578693c388f386afd15e1c9affd4fc1fda6732f384d6c5

build:
  number: 2
  skip: not linux or cuda_compiler_version == "None"
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - sevenn = sevenn.main.sevenn:main
      - sevenn_get_model = sevenn.main.sevenn_get_model:main
      - sevenn_graph_build = sevenn.main.sevenn_graph_build:main
      - sevenn_inference = sevenn.main.sevenn_inference:main
      - sevenn_patch_lammps = sevenn.main.sevenn_patch_lammps:main
      - sevenn_preset = sevenn.main.sevenn_preset:main

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cuda') }}
  host:
    - python
    - setuptools >=61.0
    - pip
    - pytorch
    - cuda-cudart
  run:
    - ninja
    - setuptools >=61.0
    - pandas
    - requests
    - matscipy
    - python
    - ase
    - braceexpand
    - pyyaml
    - e3nn >=0.5.0
    - tqdm
    - scikit-learn
    - pytorch_geometric >=2.5.0
    - numpy
    - cuda-cudart

tests:
  - python:
      imports:
        - sevenn
      pip_check: false
  - requirements:
      run: {}
    script:
      - sevenn --help
      - sevenn_get_model --help
      - sevenn_graph_build --help
      - sevenn_inference --help
      - sevenn_patch_lammps --help
      - sevenn_preset --help

about:
  summary: Scalable EquiVariance Enabled Neural Network
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/MDIL-SNU/SevenNet

extra:
  recipe-maintainers:
    - jan-janssen
